name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for the deep tier (Windows gate, mutation) on any ref —
  # e.g. to verify a portability fix on a branch before merging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  gate-windows:
    name: Quality gate (windows)
    # Deep tier, like mutation: the template must work everywhere, but the
    # per-PR loop is not where that check earns its keep — Windows runners are
    # billed at 2× and are slow, and portability regressions are rare. Runs
    # post-merge on main, and on demand (workflow_dispatch) to verify a
    # portability fix on a branch. Its first-ever run caught a real bug:
    # no .gitattributes meant CRLF checkouts, failing Biome on every line.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

  mutation:
    name: Mutation testing (core)
    # Deep check — post-merge on main and on demand, to keep PRs to the fast
    # gate. (You also run it locally at each close-step, before opening the PR.)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `incremental: true` in stryker.config.json only pays off if the state
      # file survives the run — otherwise every CI run mutates everything.
      - name: Restore Stryker incremental state
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-

      - run: pnpm test:mutation

      # A score in a log line is not actionable; the HTML report shows which
      # mutants survived and where.
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependabot handles the routine bumps; this fails the build on a known
      # high or critical advisory, which should not wait for a weekly PR.
      - run: pnpm audit --audit-level high
